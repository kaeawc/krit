# TEMPORARY diagnostic (do not merge): why does krit 0.3.1 find 0 issues in
# tests/fixtures/positive/style on macOS since #1565?
name: diag-macos-krit031
on:
  pull_request:
permissions:
  contents: read
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          version: '0.5.0'
          run: 'false'
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Probe krit built from this commit
        shell: bash
        run: |
          set +e -u
          ulimit -n; launchctl limit maxfiles 2>/dev/null
          cp "$(command -v krit)" /tmp/kritdev; /tmp/kritdev --version
          P=tests/fixtures/positive/style
          for mode in --no-daemon ""; do
            pkill -f 'krit.*(serve|daemon)' >/dev/null 2>&1; rm -rf .krit; sleep 1
            /tmp/kritdev --no-fir $mode -f json $P >/tmp/out 2>/tmp/err; echo "dev mode=[$mode] exit=$? n=$(jq '.findings|length' /tmp/out)"; head -c 1500 /tmp/err; echo
          done
          echo "##### daemon.log"; tail -c 6000 .krit/daemon.log 2>&1
