version: 2

updates:
  # GitHub Actions — keeps all `uses:` pins current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]

  # Go modules — root go.mod, covers krit/krit-lsp/krit-mcp
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, go]
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  # VS Code extension (Node/npm)
  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, vscode]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # MkDocs deploy script (Python)
  - package-ecosystem: pip
    directory: /scripts/github
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docs]

  # JVM helpers (Gradle). krit-types and krit-fir both include
  # tools/krit-rule-api as a subproject, so they must be bumped together or
  # the shared build sees two Kotlin plugin versions.
  - package-ecosystem: gradle
    directories:
      - /tools/krit-types
      - /tools/krit-fir
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, gradle]
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
    ignore:
      # The embedded Kotlin compiler / Analysis API version is pinned across
      # krit-types, krit-fir, krit-rule-api, krit-custom-rule-plugin and the
      # FIR checker surface; upgrade it as a deliberate migration. The
      # IntelliJ-flavored coroutines build tracks the compiler's bundled copy.
      - dependency-name: "org.jetbrains.kotlin*"
      - dependency-name: "org.jetbrains.intellij.deps*"

  # Gradle plugin (published artifact)
  - package-ecosystem: gradle
    directory: /krit-gradle-plugin
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, gradle]
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]

  # Custom-rule authoring Gradle plugin (published artifact)
  - package-ecosystem: gradle
    directory: /krit-custom-rule-plugin
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, gradle]
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
    ignore:
      # The Kotlin Gradle plugin must match KOTLIN_COMPILER_VERSION, which
      # tracks the krit-types compiler; upgrade with the Kotlin migration.
      - dependency-name: "org.jetbrains.kotlin*"

  # Settings plugin (auto-applies krit across multi-project builds)
  - package-ecosystem: gradle
    directory: /krit-settings-plugin
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, gradle]
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
