# TEMPORARY diagnostic (do not merge): why does krit 0.3.1 find 0 issues in
# tests/fixtures/positive/style on macOS since #1565?
name: diag-macos-krit031
on:
  pull_request:
permissions:
  contents: read
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          version: '0.5.0'
          run: 'false'
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Probe 0.5.0 and main, daemon vs no-daemon, fd limits
        shell: bash
        run: |
          set +e -u
          go build -o /tmp/kritmain ./cmd/krit/ || exit 1
          cp "$(command -v krit)" /tmp/krit050
          P=tests/fixtures/positive/style
          for bin in /tmp/krit050 /tmp/kritmain; do
            for lim in default 256; do
              for try in 1 2 3; do
                pkill -f 'krit.*(serve|daemon)' >/dev/null 2>&1; rm -rf .krit; sleep 1
                ( [ "$lim" = default ] || ulimit -n "$lim"; "$bin" --no-fir -f json $P >/tmp/out 2>/tmp/err )
                echo "$(basename $bin) ulimit=$lim try=$try n=$(jq '.findings|length' /tmp/out) $(tr '\n' ' ' </tmp/err | cut -c1-200)"
              done
              echo "   daemon.log: $(tr '\n' ' ' < .krit/daemon.log 2>/dev/null | cut -c1-400)"
              pid=$(cat .krit/daemon.pid 2>/dev/null); [ -n "$pid" ] && echo "   daemon fds: $(lsof -p "$pid" 2>/dev/null | wc -l)"
            done
          done
