name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read
  checks: write
  security-events: write

# A new push to a pull request cancels that PR's older CI run: with ~30
# parallel PRs, superseded runs held runners for an hour while main's runs
# queued behind them. Pushes to main are keyed by commit, so every main
# commit keeps its own run (and its regression signal).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          family: linux
      - name: Build all binaries
        run: make build
      - name: Vet
        run: make vet
      - name: Lint rules (capability-declaration gate)
        run: make lint-rules
      - name: Oracle filter fingerprint gate
        run: go run ./internal/devtools/oraclefpcheck
      # The pre-push hook (scripts/pre-push.sh) runs the same check.
      - name: Config schema is fresh
        run: |
          ./krit --generate-schema | diff -u schemas/krit-config.schema.json - \
            || { echo "::error::schemas/krit-config.schema.json is stale; run make schema and commit it"; exit 1; }

  # Cross-vet the whole tree (including test files) for Windows so untagged
  # Unix-only syscalls (Flock, Stat_t, Setsid, ...) fail CI instead of
  # breaking the Windows release build. tree-sitter needs cgo, so use the
  # mingw-w64 cross toolchain rather than CGO_ENABLED=0.
  windows-vet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        id: go-cache
        with:
          family: windows
          writer: "true"
      # The Azure Ubuntu mirror sometimes serves these ~144 MB at about one
      # package a minute, which hits the 5-minute cap below before any Go
      # code runs. Keep the .debs in the Actions cache so most runs install
      # without touching the mirror; a cache miss downloads and saves them.
      - name: Cache mingw-w64 packages
        id: cache-mingw
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/mingw-debs
          key: mingw-w64-debs-${{ runner.os }}-${{ runner.arch }}-noble-v1
      - name: Install mingw-w64
        timeout-minutes: 5
        run: |
          # Install the cached .debs with dpkg, which only reads local files.
          # On cache hits, `apt-get install ~/mingw-debs/*.deb` was seen in CI
          # fetching the whole ~144 MB set from the mirror again and timing out.
          # A cached set that no longer installs (a newer runner image)
          # falls back to the mirror, as on a cache miss.
          if [ "${{ steps.cache-mingw.outputs.cache-hit }}" = "true" ] \
            && ls ~/mingw-debs/*.deb >/dev/null 2>&1 \
            && sudo dpkg -i ~/mingw-debs/*.deb \
            && command -v x86_64-w64-mingw32-gcc >/dev/null; then
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -f gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          mkdir -p ~/mingw-debs
          cp /var/cache/apt/archives/*mingw*.deb ~/mingw-debs/
      - name: Vet for windows/amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
        run: go vet ./...
      - name: Build krit.exe for windows/amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
        run: go build -o krit.exe ./cmd/krit/
      - uses: ./.github/actions/go-cache-save
        with:
          family: windows
          modules-hit: ${{ steps.go-cache.outputs.modules-hit }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          family: linux
      - name: Install gotestsum
        uses: ./.github/actions/go-tool
        with:
          module: gotest.tools/gotestsum
          package: gotest.tools/gotestsum
      - name: Run tests
        run: gotestsum --junitfile junit-report.xml --format standard-quiet -- -count=1 ./...
      - name: Check JUnit report exists
        id: junit-exists
        if: always()
        uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3
        with:
          files: junit-report.xml
      - name: Publish test report
        if: always() && steps.junit-exists.outputs.files_exists == 'true'
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6
        with:
          report_paths: junit-report.xml

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        id: go-cache
        with:
          family: linux
          writer: "true"
      # integration-ci skips the Go test runs the `test` job already does but
      # still compiles every binary and every test package, so its build
      # cache serves the other Linux jobs (family `linux`).
      - name: Integration tests
        run: make integration-ci
      - uses: ./.github/actions/go-cache-save
        with:
          family: linux
          modules-hit: ${{ steps.go-cache.outputs.modules-hit }}

  # fanotify exercises the Linux-only watcher backend that needs
  # CAP_SYS_ADMIN (fanotify_mark) and CAP_DAC_READ_SEARCH
  # (open_by_handle_at). These tests live behind the
  # fanotify_integration build tag so `go test ./...` on a developer
  # laptop stays quiet. The runner is already Linux; we just need to
  # invoke `go test` under sudo so the test process holds the
  # required capabilities. /tmp on GHA runners is ext4, which
  # exports file handles, so FAN_MARK_FILESYSTEM is supported
  # without the Dockerfile.fanotify tmpfs gymnastics local devs need.
  fanotify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          family: linux
      - name: Show kernel + filesystem context
        run: |
          uname -a
          echo "fs of \$TMPDIR (/tmp):"
          stat -f -c '%T' /tmp || true
      - name: Run fanotify integration tests
        # -E preserves the Go env (GOCACHE, GOMODCACHE, etc.) set by
        # setup-go; PATH is re-exported because sudo strips it by
        # default even with -E on many distros.
        run: |
          sudo -E env "PATH=$PATH" "HOME=$HOME" \
            go test -tags fanotify_integration -count=1 -v \
            ./internal/cli/serve/ -run TestFanotify

  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          family: linux
      - name: Regression check
        run: make regression

  external-rule-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          family: linux
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v5
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-cleanup: on-success
          validate-wrappers: true
      - uses: ./.github/actions/maven-mirror
      # Custom rule jars run inside the krit-fir JVM. Its shadow jar bundles
      # the Kotlin compiler, so cache the output instead of paying the build
      # on every PR. The cache key matches every other krit-fir jar cache in
      # this workflow (`hashFiles()` is only available in step contexts, so a
      # workflow-level dedup is not possible).
      - name: Cache krit-fir shadow jar
        id: cache-krit-fir
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: tools/krit-fir/build/libs
          key: krit-fir-jar-${{ hashFiles('tools/krit-fir/**/*.kt', 'tools/krit-fir/**/*.kts', 'tools/krit-rule-api/**/*.kt', 'tools/krit-rule-api/**/*.kts') }}
      # examples/external-rule/ resolves dev.jasonpearson.krit:krit-rule-api
      # from mavenLocal, so stage a known-version snapshot first.
      - name: Stage krit-rule-api to mavenLocal
        working-directory: tools/krit-rule-api
        run: ./gradlew --no-daemon publishToMavenLocal -PkritVersion=0.0.0-ci
      - name: Build krit-fir shadow jar
        if: steps.cache-krit-fir.outputs.cache-hit != 'true'
        working-directory: tools/krit-fir
        run: ./gradlew --no-daemon shadowJar
      - name: Run external-rule example integration test
        env:
          KRIT_FIR_JAR: ${{ github.workspace }}/tools/krit-fir/build/libs/krit-fir.jar
        run: go test ./tests/externalrule/ -count=1 -timeout 600s -v

  playground-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          family: linux
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v5
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-cleanup: on-success
          validate-wrappers: true
      - uses: ./.github/actions/maven-mirror
      # Cache key matches the `external-rule-example` job above.
      - name: Cache krit-fir shadow jar
        id: cache-krit-fir
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: tools/krit-fir/build/libs
          key: krit-fir-jar-${{ hashFiles('tools/krit-fir/**/*.kt', 'tools/krit-fir/**/*.kts', 'tools/krit-rule-api/**/*.kt', 'tools/krit-rule-api/**/*.kts') }}
      - name: Build krit-fir shadow jar
        if: steps.cache-krit-fir.outputs.cache-hit != 'true'
        working-directory: tools/krit-fir
        run: ./gradlew --no-daemon shadowJar
      # The playground composite-builds krit-gradle-plugin,
      # krit-custom-rule-plugin, krit-rule-api, and krit-settings-plugin
      # from the local source tree, so no mavenLocal staging needed.
      - name: Run playground custom-rule integration test
        env:
          KRIT_FIR_JAR: ${{ github.workspace }}/tools/krit-fir/build/libs/krit-fir.jar
        run: go test ./tests/playgroundrules/ -count=1 -timeout 600s -v

  krit-custom-rule-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v5
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-cleanup: on-success
          validate-wrappers: true
      - uses: ./.github/actions/maven-mirror
      # Publish krit-rule-api to mavenLocal so the functional test in the
      # custom-rule-plugin can resolve the SPI jar with a known version.
      - name: Stage krit-rule-api to mavenLocal
        working-directory: tools/krit-rule-api
        run: ./gradlew --no-daemon publishToMavenLocal -PkritVersion=0.0.0-ci
      - name: Validate krit-custom-rule-plugin
        working-directory: krit-custom-rule-plugin
        run: ./gradlew --no-daemon test --stacktrace
      - name: Upload custom-rule-plugin test reports
        if: failure()
        uses: actions/upload-artifact@de65e23aa2b7e23d713bb51fbfcb6d502f8667d8 # v4.6.2
        with:
          name: krit-custom-rule-plugin-test-reports
          path: krit-custom-rule-plugin/build/reports/tests/test/

  krit-gradle-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v5
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-cleanup: on-success
          validate-wrappers: true
      - uses: ./.github/actions/maven-mirror
      # TestKit functional tests: configuration cache, Isolated Projects and
      # the root kritCheckAll, against a fake krit binary.
      - name: Validate krit-gradle-plugin
        working-directory: krit-gradle-plugin
        run: ./gradlew --no-daemon test --stacktrace
      - name: Upload gradle-plugin test reports
        if: failure()
        uses: actions/upload-artifact@de65e23aa2b7e23d713bb51fbfcb6d502f8667d8 # v4.6.2
        with:
          name: krit-gradle-plugin-test-reports
          path: krit-gradle-plugin/build/reports/tests/test/

  krit-settings-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v5
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-cleanup: on-success
          validate-wrappers: true
      - uses: ./.github/actions/maven-mirror
      # The settings plugin's functional test spins up a multi-project Gradle
      # build that auto-applies `dev.jasonpearson.krit` (the host plugin).
      # `settings.gradle.kts` composite-builds `../krit-gradle-plugin`, so a
      # local checkout is sufficient — no mavenLocal staging needed.
      - name: Validate krit-settings-plugin
        working-directory: krit-settings-plugin
        run: ./gradlew --no-daemon test --stacktrace
      - name: Upload settings-plugin test reports
        if: failure()
        uses: actions/upload-artifact@de65e23aa2b7e23d713bb51fbfcb6d502f8667d8 # v4.6.2
        with:
          name: krit-settings-plugin-test-reports
          path: krit-settings-plugin/build/reports/tests/test/

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        id: go-cache
        with:
          family: golangci-lint
          writer: "true"
          extra-paths: ~/.cache/golangci-lint
      # go-tool builds the latest release with `go install` (GOTOOLCHAIN=auto)
      # as before, but caches the binary per resolved version.
      - name: Install golangci-lint v2
        uses: ./.github/actions/go-tool
        with:
          module: github.com/golangci/golangci-lint/v2
          package: github.com/golangci/golangci-lint/v2/cmd/golangci-lint
      - name: Install gosec
        uses: ./.github/actions/go-tool
        with:
          module: github.com/securego/gosec/v2
          package: github.com/securego/gosec/v2/cmd/gosec
      - name: Run golangci-lint
        run: golangci-lint run ./...
      - name: Run gosec
        # Excluded rules:
        #   G103 — unsafe.Pointer is used intentionally (audited) for intern-table perf
        #   G104 — best-effort cleanup (os.Remove etc.) is documented and intentional
        #   G115 — integer-overflow conversions are bounded by upstream invariants
        #   G122 — filepath.Walk callbacks scan trusted local project trees
        #   G204 — Krit shells out to git/gradle/javac/etc. by design
        #   G301/G302/G306 — caches, scratch dirs, and reports are user-readable by design
        #   G304 — vfs/fsutil/cacheutil take filesystem paths as input by design
        #   G404 — non-cryptographic randomness is used for sampling/jitter only
        #   G602 — false positive on byte conversion of UintN(256)
        #   G703 — same path-as-input rationale as G304
        #   G704 — HTTP clients accept caller-supplied URLs by design
        #
        # internal/rules is excluded (the `$` keeps internal/rules/base in
        # scope; -exclude-dir is an unanchored regexp). gosec hands every file
        # of a package to go/packages as one argument each, and go/packages
        # splits the list into separate `go list` calls once the arguments
        # pass ~16 KB. Past that point each chunk type-checks as its own
        # package, so gosec reports bogus "undefined: ...Rule" errors and exits
        # 1. internal/rules crossed that line at ~397 files. The golangci-lint
        # step above still runs gosec over internal/rules, loading the package
        # whole.
        run: gosec -exclude=G103,G104,G115,G122,G204,G301,G302,G304,G306,G404,G602,G703,G704 -exclude-dir='internal/rules$' -fmt=junit-xml -out=gosec-report.xml -stdout ./...
      - name: Check gosec report exists
        id: gosec-exists
        if: always()
        uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3
        with:
          files: gosec-report.xml
      - name: Publish security report
        if: always() && steps.gosec-exists.outputs.files_exists == 'true'
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6
        with:
          report_paths: gosec-report.xml
      - uses: ./.github/actions/go-cache-save
        with:
          family: golangci-lint
          extra-paths: ~/.cache/golangci-lint
          modules-hit: ${{ steps.go-cache.outputs.modules-hit }}

  # The krit-fir tests split into parallel jobs (shards) of about the same
  # length. A runner's 4 vCPUs are 2 cores: each shard is a Gradle run with
  # two workers and runs about two test JVMs at once (four ran each test at
  # a fraction of the speed). A Go-only change only reruns
  # fixtureParityTest (in `compiler-tests`): every other task comes from
  # main's build cache.
  # - goldens: the :compiler-tests classes generated from
  #   src/test/data/diagnostic (the golden diagnostics).
  # - differential, differential-left-out: the split differential
  #   (FirIncrementalSplitDifferential*Test) compiles every compiler-test
  #   scenario in pieces against a binary snapshot and asserts that only
  #   whole-compilation-tiered rules differ from a full compile; the second
  #   shard repeats it with a file that has a compile error in every module.
  # - compiler-tests: the other :compiler-tests classes, and
  #   `:compiler-tests:fixtureParityTest` (FixtureParityTest against the Go
  #   fixtures in tests/fixtures and the config schema, the only task with
  #   inputs outside tools/krit-fir), which finalizes `test`.
  # - planner: every other project's tests, and the planner differential,
  #   which runs about 600 synthetic files through 40 mixed edits and
  #   asserts that every planned check equals a fresh full check.
  krit-fir:
    name: krit-fir (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: goldens
            tasks: ":compiler-tests:test -Pkrit.fir.goldens=only -x :compiler-tests:fixtureParityTest"
          - shard: differential
            tasks: incrementalDifferentialTest -Pkrit.fir.differential.leftOut=skip
          - shard: differential-left-out
            tasks: incrementalDifferentialTest -Pkrit.fir.differential.leftOut=only
          - shard: compiler-tests
            tasks: ":compiler-tests:test -Pkrit.fir.goldens=skip"
          # One fork per task: :test and incrementalPlannerTest run side by
          # side.
          - shard: planner
            tasks: >-
              test incrementalPlannerTest -Pkrit.fir.test.forks=1
              -x :compiler-tests:test -x :compiler-tests:fixtureParityTest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v5
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-cleanup: on-success
          validate-wrappers: true
      - uses: ./.github/actions/maven-mirror
      # --continue reports the failures of every task, not just the first.
      - name: Validate krit-fir (${{ matrix.shard }})
        working-directory: tools/krit-fir
        env:
          TASKS: ${{ matrix.tasks }}
        run: |
          # TASKS is a list of Gradle arguments: split it on purpose.
          # shellcheck disable=SC2086
          ./gradlew --no-daemon --continue --stacktrace --max-workers=2 $TASKS
      - name: Upload krit-fir test reports
        if: failure()
        uses: actions/upload-artifact@de65e23aa2b7e23d713bb51fbfcb6d502f8667d8 # v4.6.2
        with:
          name: krit-fir-test-reports-${{ matrix.shard }}
          path: |
            tools/krit-fir/build/reports/tests/test/
            tools/krit-fir/build/reports/tests/incrementalDifferentialTest/
            tools/krit-fir/build/reports/tests/incrementalPlannerTest/
            tools/krit-fir/compiler-tests/build/reports/tests/test/
            tools/krit-fir/compiler-tests/build/reports/tests/fixtureParityTest/

  # oracle-backend-parity runs the krit-fir oracle and checker gates: the
  # oracle fact contract, fixture parity, Kotlin 2.4 fixtures, property and
  # fuzz tests, rule isolation, and the daemon relative-path tests. (The job
  # keeps its name from when it compared the two oracle backends; krit-fir is
  # now the only one.)
  oracle-backend-parity:
    # The parity tests run one at a time and keep the runner's four vCPUs busy
    # in krit-fir JVMs (two concurrent processes on one runner took as long
    # as one), so two runners split them.
    name: oracle-backend-parity (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          family: linux
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v5
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-cleanup: on-success
          validate-wrappers: true
      - uses: ./.github/actions/maven-mirror
      # TestFirCheckerExceptionIsIsolatedToRuleAndFileEndToEnd adds a
      # test-only throwing probe rule from krit-fir's compiled test classes to
      # a copy of the shadow jar. Build them on every run (the jar cache below
      # can skip the Gradle build), and BEFORE the shadow jar is restored or
      # built: testClasses also builds the thin `jar`, which has the same
      # build/libs/krit-fir.jar name and would overwrite the shadow jar.
      - name: Build krit-fir test classes
        working-directory: tools/krit-fir
        run: ./gradlew --no-daemon testClasses
      - name: Cache krit-fir shadow jar
        id: cache-krit-fir
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: tools/krit-fir/build/libs
          key: krit-fir-jar-${{ hashFiles('tools/krit-fir/**/*.kt', 'tools/krit-fir/**/*.kts', 'tools/krit-rule-api/**/*.kt', 'tools/krit-rule-api/**/*.kts') }}
      - name: Build krit-fir shadow jar
        if: steps.cache-krit-fir.outputs.cache-hit != 'true'
        working-directory: tools/krit-fir
        run: ./gradlew --no-daemon shadowJar
      - name: CLI default FIR scan
        if: matrix.shard == 1
        run: |
          go build -o krit ./cmd/krit/
          project="$(mktemp -d)"
          printf 'fun answer() = 42\n' > "$project/Answer.kt"
          printf 'oracle:\n  classpath: []\n' > "$project/krit.yml"
          set +e
          KRIT_FIR_JAR="$PWD/tools/krit-fir/build/libs/krit-fir.jar" ./krit --no-type-oracle "$project"
          result=$?
          set -e
          test "$result" -le 1
      # TestFirPilotParity compiles the FIR pilot fixtures through krit-fir,
      # so it needs a standalone kotlin-stdlib on the classpath. The jar is
      # normally in the Gradle module cache after the shadowJar build above,
      # but a krit-fir jar cache hit can skip that build and leave the cache
      # cold, which would make the test skip silently. Resolve the jar
      # explicitly (falling back to a dependency resolution when the cache is
      # cold) and fail loudly if it is still missing, so the test runs rather
      # than skips.
      - name: Locate kotlin-stdlib jar
        run: |
          glob() {
            local base="$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-stdlib"
            local candidates=() f
            for f in "$base"/*/*/kotlin-stdlib-*.jar; do
              [ -f "$f" ] || continue
              case "$f" in *sources*|*javadoc*) continue;; esac
              candidates+=("$f")
            done
            [ ${#candidates[@]} -eq 0 ] && return 0
            printf '%s\n' "${candidates[@]}" | sort | tail -1
          }
          jar="$(glob)"
          if [ -z "$jar" ]; then
            echo "kotlin-stdlib not in Gradle cache; downloading it through krit-fir's copyKotlinStdlib"
            # The `dependencies` report resolves metadata only and never
            # downloads jars; copyKotlinStdlib resolves the jar itself.
            (cd tools/krit-fir && ./gradlew --no-daemon --quiet copyKotlinStdlib)
            jar="$(glob)"
          fi
          if [ -z "$jar" ]; then
            echo "::error::kotlin-stdlib jar not found; TestFirPilotParity would skip"
            exit 1
          fi
          echo "KOTLIN_STDLIB_JAR=$jar" >> "$GITHUB_ENV"
          echo "kotlin-stdlib: $jar"
      # TestFirOracleDeclarationContract pins the oracle's declaration
      # surface; TestFirOracleFactContract guards the expression surface
      # (types, nullability, call targets, suspend markers, diagnostics)
      # the type-aware rules read. TestFirFixtureParity
      # compiles every FIR rule's Go fixtures through krit-fir against the
      # compiler-tests stub library (the Java stubs are compiled with javac
      # from setup-java) and requires per-line agreement with the Go rule;
      # TestOracleKotlin24* and TestFirKotlin24Parity (#785) run the Kotlin 2.4
      # fixtures (named context parameters, explicit backing fields, `@all:`)
      # under explicit language modes; TestKMPSourceSetParity checks KMP
      # source sets against kotlinc ground truth;
      # the per-checker correctness tests pin known edge shapes; the rule
      # isolation test proves a throwing checker costs only its own rule and
      # file. The daemon relative-path tests prove `krit .` scans of different
      # projects never share a daemon and that the daemon's facts come back
      # (and are cached) under the caller's relative spelling.
      - name: Run oracle backend parity
        # Shards 1 and 2 split one -run list: shard 1 runs SPLIT, shard 2 runs
        # the full list with -skip SPLIT. Shard 3 runs every other parity test
        # (except the warm-clean-matrix job's rows): FIR end-to-end tests
        # missing from TESTS used to run only in the `test` job, which has no
        # krit-fir jar, so they skipped everywhere and went stale unnoticed.
        env:
          TESTS: TestFirOracleDeclarationContract|TestOracleAcceptsClasspathFlag|TestKMPSourceSetParity|TestOracleKotlin24|TestFirKotlin24Parity|TestFirOracleFactContract|TestFirFixtureParity|TestFirProperty|FuzzFirCheckers|TestComposeRememberWithoutKey_|TestCollectInOnCreateWithoutLifecycle_|TestInjectDispatcher_|TestUnsafeCastWhenNullable_|TestFirCheckerExceptionIsIsolatedToRuleAndFileEndToEnd|TestFirCheckDaemonRelativeScansOfTwoProjectsStaySeparate|TestOracleDaemonRelative|TestFirResolvesGeneratedSrcjarEndToEnd|TestFirSplitsSessionsBySourceSetSettingsEndToEnd|TestFirCoverageIsReportedWithoutVerboseEndToEnd
          SPLIT: TestFirProperty|FuzzFirCheckers|TestComposeRememberWithoutKey_|TestCollectInOnCreateWithoutLifecycle_|TestUnsafeCastWhenNullable_|TestOracleKotlin24
          # Needs KRIT_FIR_OLD_JAR (a krit-fir jar from before delegation),
          # which CI doesn't build.
          SHARD3_MAY_SKIP: TestDelegatedFirScanWithAnOlderJarFallsBack
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          if [ "$SHARD" = 1 ]; then
            select=(-run "$SPLIT")
          elif [ "$SHARD" = 2 ]; then
            select=(-run "$TESTS" -skip "$SPLIT")
          else
            select=(-skip "$TESTS|TestWarmCleanMutation")
          fi
          go test ./tests/parity/ -count=1 -timeout 30m "${select[@]}" -v | tee parity.log
          if grep -q 'no tests to run' parity.log; then
            echo "::error::shard $SHARD selected no tests"
            exit 1
          fi
          # Top-level tests only: an exempt rule's subtest may skip. The
          # daemon relative-path tests' per-backend subtests must all run.
          # Shard 3 runs every other parity test with the jar; any top-level
          # skip there means a prerequisite went missing, except the tests
          # listed in SHARD3_MAY_SKIP (they need inputs CI never provides).
          if [ "$SHARD" = 3 ]; then
            unexpected=$(grep -oE -- '--- SKIP: Test[A-Za-z0-9_]+ \(' parity.log | sed -E 's/--- SKIP: (Test[A-Za-z0-9_]+) \(/\1/' | grep -vxE "$SHARD3_MAY_SKIP" || true)
            if [ -n "$unexpected" ]; then
              echo "::error::shard 3 skipped parity tests that must run with the krit-fir jar: $(echo "$unexpected" | tr '\n' ' ')"
              exit 1
            fi
          fi
          if grep -qE -- '--- SKIP: (TestFirOracleDeclarationContract|TestOracleAcceptsClasspathFlag|TestKMPSourceSetParity|TestFirOracleFactContract|TestOracleKotlin24[A-Za-z]+|TestFirKotlin24Parity|TestFirFixtureParity|TestFirProperty_[A-Za-z]+|FuzzFirCheckers|Test(ComposeRememberWithoutKey|CollectInOnCreateWithoutLifecycle|InjectDispatcher|UnsafeCastWhenNullable)_[A-Za-z]+|TestFirCheckerExceptionIsIsolatedToRuleAndFileEndToEnd|TestFirCheckDaemonRelativeScansOfTwoProjectsStaySeparate|TestOracleDaemonRelative[A-Za-z]+(/fir(-symlink)?)?|TestFirResolvesGeneratedSrcjarEndToEnd|TestFirSplitsSessionsBySourceSetSettingsEndToEnd|TestFirCoverageIsReportedWithoutVerboseEndToEnd) \(' parity.log; then
            echo "::error::a FIR parity/property/fuzz test skipped; the CI parity job must execute them"
            exit 1
          fi

  # warm-clean-matrix (#786) seeds a warm cache or daemon for the structural
  # pipeline and for the krit-fir oracle, mutates the
  # project (return type, nullability, signature, annotations, file add /
  # delete / rename, imports, overloads, classpath, helper jar), and requires
  # the warm result to equal a fresh process's over the same tree. It is a
  # sibling of oracle-backend-parity so its ~10 minutes run in parallel; it
  # needs the same helper jars. KRIT_WARM_CLEAN_MATRIX=1 opts the tests in (a
  # plain `make test` skips them), and a top-level skip fails the job, so a
  # missing jar cannot silently pass.
  #
  # Two runners split the matrix: shard 1 runs the FIR rows with absolute
  # paths (one-shot and daemon, which share clean baselines), shard 2 the
  # full selection with -skip of those rows, so together they run exactly the
  # rows a single `-run TestWarmCleanMutation` selects. (The rows keep a
  # runner's vCPUs busy, so two processes on one runner gain nothing.)
  warm-clean-matrix:
    name: warm-clean-matrix (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          family: linux
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v5
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-cleanup: on-success
          validate-wrappers: true
      - uses: ./.github/actions/maven-mirror
      - name: Cache krit-fir shadow jar
        id: cache-krit-fir
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: tools/krit-fir/build/libs
          key: krit-fir-jar-${{ hashFiles('tools/krit-fir/**/*.kt', 'tools/krit-fir/**/*.kts', 'tools/krit-rule-api/**/*.kt', 'tools/krit-rule-api/**/*.kts') }}
      - name: Build krit-fir shadow jar
        if: steps.cache-krit-fir.outputs.cache-hit != 'true'
        working-directory: tools/krit-fir
        run: ./gradlew --no-daemon shadowJar
      - name: Locate kotlin-stdlib jar
        run: |
          glob() {
            local base="$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-stdlib"
            local candidates=() f
            for f in "$base"/*/*/kotlin-stdlib-*.jar; do
              [ -f "$f" ] || continue
              case "$f" in *sources*|*javadoc*) continue;; esac
              candidates+=("$f")
            done
            [ ${#candidates[@]} -eq 0 ] && return 0
            printf '%s\n' "${candidates[@]}" | sort | tail -1
          }
          jar="$(glob)"
          if [ -z "$jar" ]; then
            echo "kotlin-stdlib not in Gradle cache; downloading it through krit-fir's copyKotlinStdlib"
            # The `dependencies` report resolves metadata only and never
            # downloads jars; copyKotlinStdlib resolves the jar itself.
            (cd tools/krit-fir && ./gradlew --no-daemon --quiet copyKotlinStdlib)
            jar="$(glob)"
          fi
          if [ -z "$jar" ]; then
            echo "::error::kotlin-stdlib jar not found; the warm-versus-clean matrix needs it for krit-fir"
            exit 1
          fi
          echo "KOTLIN_STDLIB_JAR=$jar" >> "$GITHUB_ENV"
          echo "kotlin-stdlib: $jar"
      - name: Run warm-versus-clean mutation matrix
        env:
          KRIT_FIR_JAR: ${{ github.workspace }}/tools/krit-fir/build/libs/krit-fir.jar
          KRIT_WARM_CLEAN_MATRIX: "1"
          FIR_ABS_ROWS: TestWarmCleanMutationFIR//^abs$
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          if [ "$SHARD" = 1 ]; then
            select=(-run "$FIR_ABS_ROWS")
          else
            select=(-run 'TestWarmCleanMutation' -skip "$FIR_ABS_ROWS")
          fi
          go test ./tests/parity/ -count=1 -timeout 45m "${select[@]}" -v | tee matrix.log
          if ! grep -qE -- '--- (PASS|SKIP): TestWarmCleanMutation[A-Za-z]*/' matrix.log; then
            echo "::error::shard $SHARD ran no warm-versus-clean rows"
            exit 1
          fi
          # Top-level tests only: a row may skip itself (a known stale-cache
          # bug listed in wcKnownStale, or the compiler-setting row waiting on
          # #784), but a whole matrix must not.
          if grep -qE -- '--- SKIP: TestWarmCleanMutation[A-Za-z]* \(' matrix.log; then
            echo "::error::a warm-versus-clean matrix test skipped as a whole; the CI job must execute it"
            exit 1
          fi
      - name: Upload matrix log
        if: failure()
        uses: actions/upload-artifact@de65e23aa2b7e23d713bb51fbfcb6d502f8667d8 # v4.6.2
        with:
          name: warm-clean-matrix-log-${{ matrix.shard }}
          path: matrix.log

  krit-lint-sarif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          family: linux
      - name: Build and self-lint
        run: bash scripts/self-lint.sh
      - name: Upload SARIF
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: results.sarif
          category: krit-self-lint

  # The root action.yml (uses: kaeawc/krit@vX.Y.Z) on every runner OS: it
  # installs a checksum-verified release and puts krit on PATH, and on Linux
  # and macOS runs it with SARIF output. `uses: ./` has no release ref, so the
  # version is pinned. The Windows leg stops at the install: krit 0.3.1's scan
  # hangs on windows-latest (with --no-fir --no-type-oracle too), which is a
  # krit bug, not the action's.
  setup-action:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            run: 'true'
          - os: macos-latest
            run: 'true'
          - os: windows-latest
            run: 'false'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: krit
        uses: ./
        with:
          version: '0.3.1'
          run: ${{ matrix.run }}
          paths: tests/fixtures/positive/style
          args: --no-fir
          sarif-file: ${{ runner.temp }}/krit.sarif
          fail-on-findings: 'false'
      - name: Check the action's outputs
        shell: bash
        env:
          VERSION: ${{ steps.krit.outputs.version }}
          KRIT_PATH: ${{ steps.krit.outputs.path }}
          RAN: ${{ matrix.run }}
          COUNT: ${{ steps.krit.outputs.findings-count }}
          SARIF: ${{ steps.krit.outputs.sarif-file }}
        run: |
          set -euo pipefail
          krit --version | grep -Fx "krit 0.3.1"
          test "$VERSION" = "0.3.1"
          test -d "$KRIT_PATH"
          if [ "$RAN" = "true" ]; then
            test -s "$SARIF"
            test "$COUNT" -gt 0
            test "$COUNT" = "$(jq '[.runs[]?.results[]?] | length' "$SARIF")"
            echo "krit $VERSION reported $COUNT findings"
          fi

  # The Bazel module (bazel/) against the krit and krit-fir built from this
  # commit (KRIT_BAZEL_LOCAL_DIST), on the e2e module's Bazel version (with
  # the rules_android module bazel/e2e_android) and on Bazel 9: type-aware krit_test finds a FIR-only issue through Bazel's
  # compile classpath, and a second run after `bazel clean` must be served
  # entirely from the disk cache. See scripts/bazel-e2e-local.sh.
  bazel-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The e2e module's Bazel, with the rules_android module
          # (bazel/e2e_android, on the runner's preinstalled Android SDK).
          - bazel: ""
            android: "1"
          - bazel: "9.x"
            android: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          family: linux
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v5
        with:
          distribution: zulu
          java-version: "21"
      - uses: ./.github/actions/maven-mirror
      # Cache key matches the `external-rule-example` job above.
      - name: Cache krit-fir shadow jar
        id: cache-krit-fir
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: tools/krit-fir/build/libs
          key: krit-fir-jar-${{ hashFiles('tools/krit-fir/**/*.kt', 'tools/krit-fir/**/*.kts', 'tools/krit-rule-api/**/*.kt', 'tools/krit-rule-api/**/*.kts') }}
      - name: Build krit-fir shadow jar
        if: steps.cache-krit-fir.outputs.cache-hit != 'true'
        working-directory: tools/krit-fir
        run: ./gradlew --no-daemon shadowJar
      - name: Cache Bazel downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-${{ matrix.bazel }}-${{ hashFiles('bazel/MODULE.bazel', 'bazel/e2e/MODULE.bazel', 'bazel/e2e_android/MODULE.bazel', 'bazel/e2e/.bazelversion') }}
          restore-keys: bazel-repo-${{ matrix.bazel }}-
      - name: Bazel e2e (cache hit on rerun)
        env:
          BAZEL: bazelisk
          USE_BAZEL_VERSION: ${{ matrix.bazel }}
          KRIT_E2E_ANDROID: ${{ matrix.android }}
          KRIT_FIR_JAR: ${{ github.workspace }}/tools/krit-fir/build/libs/krit-fir.jar
        run: bash scripts/bazel-e2e-local.sh --repository_cache="$HOME/.cache/bazel-repo" --downloader_config="$GITHUB_WORKSPACE/scripts/bazel-ci-downloader.cfg"

  # actionlint validates the workflow files themselves — catches semantic
  # mistakes (e.g. `hashFiles()` at workflow-`env` scope) that plain YAML
  # parsers accept but GitHub Actions silently rejects, causing the
  # workflow to fail to load with zero checks scheduled.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install actionlint
        uses: ./.github/actions/go-tool
        with:
          module: github.com/rhysd/actionlint
          package: github.com/rhysd/actionlint/cmd/actionlint
      - name: Run actionlint
        run: bash scripts/lint-actions.sh

  # perf-guard (#1657) times krit at the PR's base and head side by side on
  # this runner: pinned public corpora (tests/corpus/repos.json), a synthetic
  # Android-shaped project and the playground, in interleaved rounds. It
  # fails when head's median total, a phase or a rule is slower than the
  # gates in internal/devtools/perfguard allow, or when a phase scales
  # super-linearly on a 6x larger synthetic project (unless
  # known-superlinear.txt lists it with its issue). The comparison is posted
  # as a sticky PR comment and the job summary. No stored baseline: a shared
  # runner's speed varies from run to run, so only same-runner A/B timings
  # are compared. Locally: make perf-guard.
  perf-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          family: linux
      - name: Cache pinned corpora
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/perf-guard/corpus
          key: perf-guard-corpus-${{ hashFiles('tests/corpus/repos.json') }}
      - name: Base vs head
        id: guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          KRIT_PERF_DIR: ${{ runner.temp }}/perf-guard
        run: |
          set +e
          bash scripts/perf-guard.sh --base "$BASE_SHA"
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          KRIT_PERF_DIR: ${{ runner.temp }}/perf-guard
        run: |
          body="$KRIT_PERF_DIR/comment.md"
          {
            echo '<!-- krit-perf-guard -->'
            cat "$KRIT_PERF_DIR/compare.md" "$KRIT_PERF_DIR/scale.md" 2>/dev/null || echo "perf-guard produced no report; see the job log."
            echo
            echo "<sub>perf-guard (#1657): median of interleaved runs on one runner. Reproduce locally with \`make perf-guard\`.</sub>"
          } > "$body"
          cat "$body" >> "$GITHUB_STEP_SUMMARY"
          # Fork PRs get a read-only token; the job summary still has the report.
          if [ "$SAME_REPO" != "true" ]; then
            exit 0
          fi
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- krit-perf-guard -->")) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$body" >/dev/null
          fi
      - name: Fail on a regression
        if: steps.guard.outputs.status != '0'
        env:
          STATUS: ${{ steps.guard.outputs.status }}
        run: |
          if [ "$STATUS" = 1 ]; then
            echo "::error::perf-guard found a performance regression; see the PR comment or job summary"
          else
            echo "::error::perf-guard failed to run (status $STATUS); see the Base vs head step"
          fi
          exit 1
