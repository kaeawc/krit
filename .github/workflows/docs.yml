name: Documentation
on:
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', 'cmd/krit-docgen/**', 'internal/docgen/**', 'internal/rules/**', 'tests/fixtures/**', 'config/detekt-defaults.yml', 'README.md', 'CONTRIBUTING.md', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages deployments must not overlap. Queue rather than cancel so an
# in-progress production deploy always finishes; GitHub keeps only the
# newest pending run. Matches GitHub's Pages starter workflows.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and deploy are separate jobs, as in GitHub's multi-job Pages
  # starter workflows. When deploy-pages runs in the same job right after
  # upload-pages-artifact, its artifact lookup can miss the just-finalized
  # artifact ("No artifacts named github-pages were found"); see
  # https://github.com/actions/deploy-pages/issues/451.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - run: pip install mkdocs mkdocs-material

      # Per-rule pages are generated, not committed (docs/rules/ is gitignored).
      - run: go run ./cmd/krit-docgen

      - run: mkdocs build --strict

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
