name: Publish to Maven Central

# Publishes krit-rule-api, the self-contained krit-fir oracle jar, and the
# dev.jasonpearson.krit and dev.jasonpearson.krit.settings Gradle plugins
# (jar + plugin marker each) to Maven Central, and the two plugins to the
# Gradle Plugin Portal when its keys are set. The plugins are smoke-tested
# from their staged output before either is uploaded.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without leading v). Defaults to the current tag.'
        required: false
        type: string
      publishing_type:
        description: 'Leave the deployment for manual publish/drop in the Central Portal (user_managed) or publish it for real (automatic).'
        required: false
        type: choice
        options:
          - user_managed
          - automatic
        default: user_managed

permissions:
  contents: read

jobs:
  publish:
    # Stable vX.Y.Z tags only (not prereleases, not the action's floating
    # major tag v0); manual dispatch always proceeds, including for recovery.
    if: ${{ github.event_name == 'workflow_dispatch' || (!contains(github.ref_name, '-') && contains(github.ref_name, '.')) }}
    runs-on: ubuntu-latest
    concurrency:
      group: publish-maven-central-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # A tag push without the Central secrets skips with a warning instead of
      # failing the tag (v0.3.0 and v0.3.1 went red only because they were
      # unset); it publishes on the first tag after they are configured. A
      # manual dispatch is an explicit request, so it still fails.
      - name: Check Maven Central secrets
        id: secrets
        env:
          SIGNING_KEY: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.MAVEN_CENTRAL_SIGNING_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$SIGNING_KEY" ] || missing+=(MAVEN_CENTRAL_SIGNING_KEY)
          [ -n "$SIGNING_PASSWORD" ] || missing+=(MAVEN_CENTRAL_SIGNING_PASSWORD)
          [ -n "$SONATYPE_USERNAME" ] || missing+=(SONATYPE_USERNAME)
          [ -n "$SONATYPE_PASSWORD" ] || missing+=(SONATYPE_PASSWORD)
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          msg="Maven Central secrets not configured: ${missing[*]}. See docs/release.md#required-repository-secrets."
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "::error::$msg"
            exit 1
          fi
          echo "::warning::$msg Skipping the Maven Central publish."
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v5
        with:
          distribution: zulu
          java-version: '21'
      - if: steps.secrets.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-cleanup: on-success
          validate-wrappers: true
      # Derive the version from dispatch input or v-prefixed tag, failing closed otherwise.
      - name: Resolve publish version
        if: steps.secrets.outputs.ready == 'true'
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_VERSION:-}" ]; then
            ver="${DISPATCH_VERSION}"
          elif [[ "${GITHUB_REF_TYPE:-}" = "tag" ]] && [[ "${GITHUB_REF_NAME}" =~ ^v ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            echo "::error::No version available — workflow_dispatch needs an input and push must be a v* tag"
            exit 1
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${ver}"
      - name: Publish krit-rule-api
        if: steps.secrets.outputs.ready == 'true'
        working-directory: tools/krit-rule-api
        env:
          KRIT_VERSION: ${{ steps.version.outputs.version }}
          SIGNING_KEY: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.MAVEN_CENTRAL_SIGNING_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          ./gradlew --no-daemon \
            publishAllPublicationsToStagingDirRepository \
            publishAllPublicationsToCentralPortalRepository
      - name: Publish krit-fir to Sonatype Central Portal
        if: steps.secrets.outputs.ready == 'true'
        working-directory: tools/krit-fir
        env:
          KRIT_VERSION: ${{ steps.version.outputs.version }}
          SIGNING_KEY: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.MAVEN_CENTRAL_SIGNING_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          ./gradlew --no-daemon \
            :publishAllPublicationsToStagingDirRepository \
            :publishAllPublicationsToCentralPortalRepository
      # Both plugins are staged locally and smoke-tested before either is
      # uploaded, so a broken POM, module file, or plugin marker fails the
      # release before either plugin is uploaded and before anything is
      # finalized.
      - name: Stage krit-gradle-plugin
        if: steps.secrets.outputs.ready == 'true'
        working-directory: krit-gradle-plugin
        env:
          KRIT_VERSION: ${{ steps.version.outputs.version }}
          SIGNING_KEY: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.MAVEN_CENTRAL_SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon publishAllPublicationsToStagingDirRepository
      - name: Stage krit-settings-plugin
        if: steps.secrets.outputs.ready == 'true'
        working-directory: krit-settings-plugin
        env:
          KRIT_VERSION: ${{ steps.version.outputs.version }}
          SIGNING_KEY: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.MAVEN_CENTRAL_SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon publishAllPublicationsToStagingDirRepository
      - name: Smoke-test staged Gradle plugins
        if: steps.secrets.outputs.ready == 'true'
        env:
          KRIT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/release/plugin-smoke.sh "$KRIT_VERSION" \
            krit-gradle-plugin/build/staging-deploy \
            krit-settings-plugin/build/staging-deploy
      - name: Publish krit-gradle-plugin to Sonatype Central Portal
        if: steps.secrets.outputs.ready == 'true'
        working-directory: krit-gradle-plugin
        env:
          KRIT_VERSION: ${{ steps.version.outputs.version }}
          SIGNING_KEY: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.MAVEN_CENTRAL_SIGNING_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: ./gradlew --no-daemon publishAllPublicationsToCentralPortalRepository
      - name: Publish krit-settings-plugin to Sonatype Central Portal
        if: steps.secrets.outputs.ready == 'true'
        working-directory: krit-settings-plugin
        env:
          KRIT_VERSION: ${{ steps.version.outputs.version }}
          SIGNING_KEY: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.MAVEN_CENTRAL_SIGNING_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: ./gradlew --no-daemon publishAllPublicationsToCentralPortalRepository
      - name: Finalize Sonatype Central Portal staging repository
        if: steps.secrets.outputs.ready == 'true'
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          CENTRAL_PUBLISHING_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.publishing_type || 'automatic' }}
        run: scripts/release/central-portal-upload.sh
      # The Gradle Plugin Portal is optional: without its keys the plugin is
      # still on Maven Central (consumers add mavenCentral() to
      # pluginManagement). Only real (automatic) publishes go to the portal,
      # since it has no staging step to drop.
      - name: Publish Gradle plugins to the Gradle Plugin Portal
        if: steps.secrets.outputs.ready == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publishing_type == 'automatic')
        env:
          KRIT_VERSION: ${{ steps.version.outputs.version }}
          SIGNING_KEY: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.MAVEN_CENTRAL_SIGNING_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${GRADLE_PUBLISH_KEY}" ] || [ -z "${GRADLE_PUBLISH_SECRET}" ]; then
            echo "::warning::GRADLE_PUBLISH_KEY / GRADLE_PUBLISH_SECRET not set; skipping the Gradle Plugin Portal publish."
            exit 0
          fi
          for plugin in krit-gradle-plugin krit-settings-plugin; do
            (cd "$plugin" && ./gradlew --no-daemon publishPlugins \
              -Pgradle.publish.key="${GRADLE_PUBLISH_KEY}" \
              -Pgradle.publish.secret="${GRADLE_PUBLISH_SECRET}")
          done
      # Failure bundle helps diagnose rejected Central publications.
      - name: Upload staged artifacts for inspection
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: oracle-jars-${{ steps.version.outputs.version }}
          path: |
            tools/krit-rule-api/build/staging-deploy/
            tools/krit-fir/build/staging-deploy/
            krit-gradle-plugin/build/staging-deploy/
            krit-settings-plugin/build/staging-deploy/
          if-no-files-found: warn
          retention-days: 14
