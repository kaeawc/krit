# Bazel downloader config for CI (--downloader_config). GitHub runners share
# IP addresses and Maven Central answers them with 429 Too Many Requests, so
# each Maven Central URL is tried on Google's mirror of it first, then on
# Maven Central itself. Downloads are still checked against their pinned
# checksums.
rewrite repo1.maven.org/maven2/(.*) maven-central.storage-download.googleapis.com/maven2/$1
rewrite repo1.maven.org/maven2/(.*) repo1.maven.org/maven2/$1
