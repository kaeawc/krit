name: Publish to Bazel Central Registry

# Pushes a branch to kaeawc/bazel-central-registry that adds the `krit`
# module (bazel/ in this repository) at the tagged version, and prints a link
# that opens the pull request against bazelbuild/bazel-central-registry. The
# templates live in .bcr/bazel/ and .bcr/config.yml points moduleRoots at
# bazel/. See docs/release.md#bazel-central-registry.
#
# The module's repository rule downloads the release archives and
# checksums.txt, so BCR's presubmit needs the GitHub release to be public.
# This runs after the Release workflow succeeds instead of on the tag push
# (the release stays a draft until its last step).
on:
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (for example v0.4.0).'
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    # A successful Release run for a stable vX.Y.Z tag (head_branch is the
    # tag for tag-triggered runs; prereleases and the floating v0 tag are
    # excluded); a manual dispatch always proceeds.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      !contains(github.event.workflow_run.head_branch, '-') &&
      contains(github.event.workflow_run.head_branch, '.')) }}
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.token.outputs.ready }}
      tag_name: ${{ steps.token.outputs.tag_name }}
    steps:
      # Without the token a release-triggered run skips with a warning; a dispatch
      # is an explicit request, so it fails.
      - name: Check BCR publish token
        id: token
        env:
          BCR_PUBLISH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}
          EVENT: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag_name }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          echo "tag_name=${DISPATCH_TAG:-$RUN_TAG}" >> "$GITHUB_OUTPUT"
          if [ -n "$BCR_PUBLISH_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          msg="BCR_PUBLISH_TOKEN is not configured. See docs/release.md#bazel-central-registry."
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "::error::$msg"
            exit 1
          fi
          echo "::warning::$msg Skipping the Bazel Central Registry publish."
      # BCR's presubmit downloads this release's assets, so refuse a draft
      # or missing release (a dispatch can name any tag).
      - name: Check the GitHub release is public
        if: steps.token.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.token.outputs.tag_name }}
        run: |
          set -euo pipefail
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [ "$draft" != "false" ]; then
            echo "::error::Release $TAG is not published yet; BCR presubmit could not download its assets."
            exit 1
          fi

  publish:
    needs: check
    if: needs.check.outputs.ready == 'true'
    # The release itself is not built with bazel-contrib's release_ruleset
    # workflow, so BCR would reject attestations made here; publish without.
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@1ae09341a6014e9bea052879c42392ac6b8b632c # v1.7.0
    with:
      tag_name: ${{ needs.check.outputs.tag_name }}
      registry_fork: kaeawc/bazel-central-registry
      attest: false
      # BCR_PUBLISH_TOKEN is a fine-grained token limited to the fork, and
      # fine-grained tokens cannot open pull requests against a public
      # repository the owner does not own. The run's "Open pull request
      # manually" step prints the link instead; open it as a draft and mark it
      # ready, which BCR takes as the maintainer's approval.
      open_pull_request: false
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
