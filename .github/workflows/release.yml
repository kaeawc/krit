name: Release
on:
  push:
    tags: ['v*']
  # Nightly tags are pushed with GITHUB_TOKEN, which cannot trigger the
  # push event above; nightly.yml dispatches this workflow on the tag.
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # Per-goos matrix: each runner natively builds its OS's targets via
  # goreleaser, producing dist/ with archives + checksums + signatures.
  # We --skip=publish here; the funnel job handles GitHub release create,
  # the brew cask, and the scoop manifest.
  build:
    # A dispatch must name a tag ref; a branch is not a release, and neither
    # is the action's floating major tag (v0), which has no dot.
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '.')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            ids: krit-linux,krit-lsp-linux,krit-mcp-linux,krit-linux-musl,krit-lsp-linux-musl,krit-mcp-linux-musl
          - os: macos-latest
            goos: darwin
            ids: krit-darwin,krit-lsp-darwin,krit-mcp-darwin
          - os: windows-latest
            goos: windows
            ids: krit-windows,krit-lsp-windows,krit-mcp-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: go.mod }

      # Linux cross-compilation uses zig cc for both arm64-glibc and
      # amd64-musl targets. Ubuntu's gcc-aarch64-linux-gnu and
      # musl-tools have well-known sysroot/library issues with cgo;
      # zig bundles glibc + musl + sysroots in one binary and is the
      # standard escape hatch. Install once and write per-target
      # wrapper scripts on PATH so .goreleaser.yml can reference plain
      # CC values.
      - if: matrix.goos == 'linux'
        name: Install zig + cross-cc wrappers
        run: |
          set -euo pipefail
          ZIG_VERSION=0.13.0
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" \
            | sudo tar -xJ -C /opt
          sudo ln -sf "/opt/zig-linux-x86_64-${ZIG_VERSION}/zig" /usr/local/bin/zig
          for target in glibc-arm64:aarch64-linux-gnu musl-amd64:x86_64-linux-musl; do
            name="${target%:*}"
            zig_target="${target##*:}"
            sudo tee "/usr/local/bin/zigcc-${name}" > /dev/null <<EOF
          #!/usr/bin/env bash
          exec zig cc -target ${zig_target} "\$@"
          EOF
            sudo chmod +x "/usr/local/bin/zigcc-${name}"
          done
          zig version
          zigcc-glibc-arm64 --version | head -1
          zigcc-musl-amd64 --version | head -1

      # Import the release signing subkey for goreleaser's signs: block.
      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          fingerprint: ${{ secrets.GPG_FINGERPRINT }}

      # Install syft so goreleaser's sboms: block can run. None of the
      # GitHub-hosted runners ship syft preinstalled. anchore/sbom-action
      # downloads the right binary for the current OS/arch.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # `goreleaser release` doesn't accept --id filters (build-only flag),
      # so we filter the config down to this matrix entry's ids before
      # invoking it. See scripts/release/filter-goreleaser-config.py.
      # actions/setup-python provides an isolated Python without
      # PEP 668's externally-managed-environment guard.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      # Write the filtered config to RUNNER_TEMP rather than the repo
      # working tree — goreleaser refuses to release with untracked
      # files present.
      - name: Filter goreleaser config to current OS
        shell: bash
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/release/filter-goreleaser-config.py "${{ matrix.ids }}" > "$RUNNER_TEMP/goreleaser-${{ matrix.goos }}.yml"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '~> v2'
          args: release --config ${{ runner.temp }}/goreleaser-${{ matrix.goos }}.yml --clean --skip=publish --skip=announce
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          # The commit can also carry the action's floating major tag (v0).
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      # Upload everything except the per-goos checksums/sigs — the
      # funnel produces a unified set covering all platforms.
      - name: Stage uploadable artifacts
        shell: bash
        run: |
          mkdir staged
          # Goreleaser names SBOMs as <archive>.sbom.json. Glob both
          # explicitly so we don't pick up goreleaser's internal
          # metadata.json / artifacts.json by accident.
          for pat in '*.tar.gz' '*.zip' '*.sbom.json'; do
            cp dist/$pat staged/ 2>/dev/null || true
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: dist-${{ matrix.goos }}
          path: staged/
          retention-days: 1
          if-no-files-found: error

  # Build the JVM sidecar shaded jar once and stage it for the release
  # funnel: krit-fir, the type-oracle backend (also serves --daemon and
  # --custom-rule-jars). Released CLIs auto-download the asset matching
  # their version, verified against checksums.txt; see
  # internal/oracle.EnsureBackendJar.
  build-jvm-jars:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '.')
    strategy:
      fail-fast: false
      matrix:
        tool: [krit-fir]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0
      - name: Build ${{ matrix.tool }} shaded jar
        working-directory: tools/${{ matrix.tool }}
        run: ./gradlew --no-daemon shadowJar
      - name: Stage jar with release-tagged name
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TOOL: ${{ matrix.tool }}
        run: |
          set -euo pipefail
          mkdir staged
          cp "tools/${TOOL}/build/libs/${TOOL}.jar" "staged/${TOOL}-${TAG}.jar"
          ls -la staged/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: dist-${{ matrix.tool }}
          path: staged/
          retention-days: 1
          if-no-files-found: error

  # Funnel: gather every matrix runner's archives, generate one combined
  # checksums.txt covering all platforms, sign it, create the GitHub
  # release, and push the brew cask + scoop manifest to their tap repos.
  release:
    needs: [build, build-jvm-jars]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # Runs internal/devtools/releaseassets, which checks the krit-fir jar
      # before and after the release is created.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: go.mod }

      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          fingerprint: ${{ secrets.GPG_FINGERPRINT }}

      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: staging
          pattern: dist-*
          merge-multiple: true

      - name: Assemble dist/
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp staging/*.tar.gz staging/*.zip dist/ 2>/dev/null || true
          cp staging/*.sbom.json dist/ 2>/dev/null || true
          # Released CLIs download this jar; a release without it degrades
          # every FIR scan, so a missing jar fails the job here.
          cp "staging/krit-fir-${TAG}.jar" dist/
          # Source archive of the Bazel module (bazel/). The Bazel Central
          # Registry entry downloads it from this release
          # (.bcr/bazel/source.template.json); the *.tar.gz globs below
          # checksum, upload and attest it with the platform archives.
          bash scripts/release/bazel-source-archive.sh "$TAG" dist
          ls -la dist/

      - name: Generate combined checksums.txt
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          : > checksums.txt
          for f in *.tar.gz *.zip *.jar; do
            [ -f "$f" ] || continue
            sha256sum "$f" >> checksums.txt
          done
          sort -k2 checksums.txt -o checksums.txt
          cat checksums.txt

      - name: Verify krit-fir jar, Bazel source archive and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: go run ./internal/devtools/releaseassets --tag "$TAG" --dir dist

      - name: Sign combined checksums.txt
        shell: bash
        env:
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd dist
          echo "$GPG_PASSPHRASE" | gpg --batch --pinentry-mode=loopback \
            --passphrase-fd 0 --local-user "$GPG_FINGERPRINT" \
            --output checksums.txt.sig --detach-sign checksums.txt

      # The release stays a draft until every asset is uploaded and verified,
      # so a failed upload never leaves a published release without the
      # krit-fir jar that released CLIs download. A re-run of the job reuses
      # the draft.
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh --version
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it."
            exit 0
          fi
          # Any tag with a SemVer prerelease suffix (e.g. v1.5.0-nightly.20260516,
          # v1.5.0-beta.1, v1.5.0-rc1) is marked as a GitHub prerelease so it
          # doesn't show up under the "Latest" badge.
          prerelease_flag=""
          case "$TAG" in
            *-*) prerelease_flag="--prerelease" ;;
          esac
          # shellcheck disable=SC2086
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --draft \
            $prerelease_flag

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          { ls *.tar.gz *.zip *.jar *.sbom.json checksums.txt checksums.txt.sig 2>/dev/null || true; } > "$RUNNER_TEMP/release-upload.txt"
          cat "$RUNNER_TEMP/release-upload.txt"
          while IFS= read -r asset; do
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --clobber; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "::error::upload of $asset failed after $attempt attempts"
                exit 1
              fi
              sleep $((attempt * 10))
            done
          done < "$RUNNER_TEMP/release-upload.txt"

      - name: Verify uploaded release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' > "$RUNNER_TEMP/release-assets.txt"
          go run ./internal/devtools/releaseassets --tag "$TAG" \
            --published "$RUNNER_TEMP/release-assets.txt" \
            --expect "$RUNNER_TEMP/release-upload.txt"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          latest_flag="--latest"
          case "$TAG" in
            *-*) latest_flag="--latest=false" ;;
          esac
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false "$latest_flag"

      # Attest right after publishing, before the package-manager steps: a
      # tap or bucket push that fails must not leave the release without
      # provenance (v0.3.0 and v0.3.1 did).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.tar.gz,dist/*.zip,dist/*.jar'

      # The root action.yml is used as kaeawc/krit@vX.Y.Z or @vX; move the
      # floating major tag (v0, v1, ...) to each stable release. Prereleases
      # (nightlies, -rc tags) never move it.
      - name: Move floating major tag for the action
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          major="${TAG%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$major" -m "krit action ${TAG}" "${TAG}^{commit}"
          git push --force origin "refs/tags/${major}"
          echo "Moved ${major} to ${TAG}"

      # Package managers only track stable releases. Tags with a SemVer
      # prerelease suffix (nightly.yml's v*-nightly.* tags, -rc/-beta tags)
      # stop at the GitHub prerelease above.
      #
      # The tap and bucket are pushed with a short-lived installation token
      # of the repository's GitHub App (GH_APP_ID / GH_APP_PRIVATE_KEY),
      # which must be installed on kaeawc/homebrew-tap and kaeawc/scoop-krit
      # with Contents: write. When the App cannot mint that token (not
      # installed there, or secrets unset) the steps fall back to the
      # HOMEBREW_TAP_TOKEN / SCOOP_BUCKET_TOKEN PATs.
      - name: Mint package-manager token
        id: pkg-token
        if: ${{ !contains(github.ref_name, '-') }}
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap,scoop-krit
          permission-contents: write

      # Each publisher runs even when the other fails; "Check package-manager
      # publishing" below fails the job afterwards and names which one broke.
      - name: Publish Homebrew cask
        id: brew
        if: ${{ !contains(github.ref_name, '-') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.pkg-token.outputs.token || secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: bash scripts/release/update-brew-tap.sh

      - name: Publish Scoop manifest
        id: scoop
        if: ${{ !contains(github.ref_name, '-') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.pkg-token.outputs.token || secrets.SCOOP_BUCKET_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: bash scripts/release/update-scoop-bucket.sh

      - name: Render winget manifests
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: bash scripts/release/render-winget-manifests.sh

      # Kept as an artifact so a release can be submitted to winget-pkgs by
      # hand when the winget job below is skipped (no WINGET_TOKEN) or fails.
      - name: Upload winget manifests
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: winget-manifests
          path: dist/winget/
          if-no-files-found: error

      - name: Check package-manager publishing
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TOKEN_SOURCE: ${{ steps.pkg-token.outputs.token != '' && 'GitHub App' || 'PAT secrets' }}
          BREW: ${{ steps.brew.outcome }}
          SCOOP: ${{ steps.scoop.outcome }}
        run: |
          set -euo pipefail
          echo "Package-manager token: $TOKEN_SOURCE"
          echo "Homebrew cask: $BREW"
          echo "Scoop manifest: $SCOOP"
          failed=0
          if [ "$BREW" != "success" ]; then
            echo "::error::Homebrew cask was not published ($BREW). Re-run the job after fixing access to kaeawc/homebrew-tap; the GitHub release itself is complete."
            failed=1
          fi
          if [ "$SCOOP" != "success" ]; then
            echo "::error::Scoop manifest was not published ($SCOOP). Re-run the job after fixing access to kaeawc/scoop-krit; the GitHub release itself is complete."
            failed=1
          fi
          exit "$failed"

  # Nightly canary for the Bazel module: once the nightly release is public,
  # resolve the krit module from a local registry whose source.json points
  # at this release's krit-bazel-<tag>.tar.gz (the way a BCR entry does) and
  # run the bazel/e2e test module, which downloads this release's binaries.
  # Stable tags are covered by BCR's own presubmit on the registry PR.
  bazel-e2e:
    needs: release
    if: ${{ contains(github.ref_name, '-nightly.') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the Bazel module from the release
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          BAZEL: bazelisk
        run: bash scripts/release/bazel-e2e.sh "$TAG"

  # Submit the rendered winget manifests to microsoft/winget-pkgs (opens a
  # PR from the token owner's winget-pkgs fork). Stable tags only, and a
  # no-op until a WINGET_TOKEN secret — a classic PAT with public_repo
  # scope — is configured. wingetcreate only ships for Windows.
  winget:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Download winget manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: winget-manifests
          path: winget

      - name: Submit to microsoft/winget-pkgs
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Output "::notice::WINGET_TOKEN is not configured; skipping winget submission. Manifests are in the winget-manifests artifact."
            exit 0
          }
          $version = $env:TAG.TrimStart('v')
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe submit --token $env:WINGET_TOKEN "winget/manifests/k/kaeawc/krit/$version"
