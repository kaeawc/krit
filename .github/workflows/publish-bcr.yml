name: Publish to Bazel Central Registry

# Opens a pull request against bazelbuild/bazel-central-registry that adds
# the `krit` module (bazel/ in this repository) at the tagged version. The
# templates live in .bcr/bazel/ and .bcr/config.yml points moduleRoots at
# bazel/. See docs/release.md#bazel-central-registry.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (for example v0.4.0).'
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    # Stable vX.Y.Z tags only (not prereleases or the floating v0 tag);
    # a manual dispatch always proceeds.
    if: ${{ github.event_name == 'workflow_dispatch' || (!contains(github.ref_name, '-') && contains(github.ref_name, '.')) }}
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.token.outputs.ready }}
      tag_name: ${{ steps.token.outputs.tag_name }}
    steps:
      # Without the token a tag push skips with a warning; a manual dispatch
      # is an explicit request, so it fails.
      - name: Check BCR publish token
        id: token
        env:
          BCR_PUBLISH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}
          EVENT: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "tag_name=${DISPATCH_TAG:-$REF_NAME}" >> "$GITHUB_OUTPUT"
          if [ -n "$BCR_PUBLISH_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          msg="BCR_PUBLISH_TOKEN is not configured. See docs/release.md#bazel-central-registry."
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "::error::$msg"
            exit 1
          fi
          echo "::warning::$msg Skipping the Bazel Central Registry publish."

  publish:
    needs: check
    if: needs.check.outputs.ready == 'true'
    # The release itself is not built with bazel-contrib's release_ruleset
    # workflow, so BCR would reject attestations made here; publish without.
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@1ae09341a6014e9bea052879c42392ac6b8b632c # v1.7.0
    with:
      tag_name: ${{ needs.check.outputs.tag_name }}
      registry_fork: kaeawc/bazel-central-registry
      attest: false
      draft: false
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
