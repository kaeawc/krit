name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read
  checks: write
  security-events: write

jobs:
  build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build all binaries
        run: make build
      - name: Vet
        run: make vet
      - name: Lint rules (capability-declaration gate)
        run: make lint-rules
      - name: Oracle filter fingerprint gate
        run: go run ./internal/devtools/oraclefpcheck

  # Cross-vet the whole tree (including test files) for Windows so untagged
  # Unix-only syscalls (Flock, Stat_t, Setsid, ...) fail CI instead of
  # breaking the Windows release build. tree-sitter needs cgo, so use the
  # mingw-w64 cross toolchain rather than CGO_ENABLED=0.
  windows-vet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The Azure Ubuntu mirror sometimes serves these ~144 MB at about one
      # package a minute, which hits the 5-minute cap below before any Go
      # code runs. Keep the .debs in the Actions cache so most runs install
      # without touching the mirror; a cache miss downloads and saves them.
      - name: Cache mingw-w64 packages
        id: cache-mingw
        uses: actions/cache@v6
        with:
          path: ~/mingw-debs
          key: mingw-w64-debs-${{ runner.os }}-${{ runner.arch }}-noble-v1
      - name: Install mingw-w64
        timeout-minutes: 5
        run: |
          # A cached set that no longer installs (a newer runner image)
          # falls back to the mirror, as on a cache miss.
          if [ "${{ steps.cache-mingw.outputs.cache-hit }}" = "true" ] \
            && ls ~/mingw-debs/*.deb >/dev/null 2>&1 \
            && sudo apt-get install -y ~/mingw-debs/*.deb; then
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          mkdir -p ~/mingw-debs
          cp /var/cache/apt/archives/*mingw*.deb ~/mingw-debs/
      - name: Vet for windows/amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
        run: go vet ./...
      - name: Build krit.exe for windows/amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
        run: go build -o krit.exe ./cmd/krit/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest
      - name: Run tests
        run: gotestsum --junitfile junit-report.xml --format standard-quiet -- -count=1 ./...
      - name: Check JUnit report exists
        id: junit-exists
        if: always()
        uses: andstor/file-existence-action@v3
        with:
          files: junit-report.xml
      - name: Publish test report
        if: always() && steps.junit-exists.outputs.files_exists == 'true'
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: junit-report.xml

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Integration tests
        run: make integration

  # fanotify exercises the Linux-only watcher backend that needs
  # CAP_SYS_ADMIN (fanotify_mark) and CAP_DAC_READ_SEARCH
  # (open_by_handle_at). These tests live behind the
  # fanotify_integration build tag so `go test ./...` on a developer
  # laptop stays quiet. The runner is already Linux; we just need to
  # invoke `go test` under sudo so the test process holds the
  # required capabilities. /tmp on GHA runners is ext4, which
  # exports file handles, so FAN_MARK_FILESYSTEM is supported
  # without the Dockerfile.fanotify tmpfs gymnastics local devs need.
  fanotify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Show kernel + filesystem context
        run: |
          uname -a
          echo "fs of \$TMPDIR (/tmp):"
          stat -f -c '%T' /tmp || true
      - name: Run fanotify integration tests
        # -E preserves the Go env (GOCACHE, GOMODCACHE, etc.) set by
        # setup-go; PATH is re-exported because sudo strips it by
        # default even with -E on many distros.
        run: |
          sudo -E env "PATH=$PATH" "HOME=$HOME" \
            go test -tags fanotify_integration -count=1 -v \
            ./internal/cli/serve/ -run TestFanotify

  intellij-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        with:
          distribution: zulu
          java-version: "21"
      - name: Set Gradle User Home
        run: echo "GRADLE_USER_HOME=$HOME/.gradle/intellij-plugin" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-cleanup: on-success
          validate-wrappers: true
      - name: Validate IntelliJ plugin
        working-directory: editors/intellij-plugin
        run: ../../tools/krit-fir/gradlew test buildPlugin verifyPlugin --stacktrace
      - name: Upload IntelliJ plugin ZIP
        if: success()
        uses: actions/upload-artifact@de65e23aa2b7e23d713bb51fbfcb6d502f8667d8 # v4.6.2
        with:
          name: krit-intellij-plugin
          path: editors/intellij-plugin/build/distributions/*.zip
      - name: Upload IntelliJ plugin test reports
        if: failure()
        uses: actions/upload-artifact@de65e23aa2b7e23d713bb51fbfcb6d502f8667d8 # v4.6.2
        with:
          name: krit-intellij-plugin-test-reports
          path: |
            editors/intellij-plugin/build/reports/tests/test/
            editors/intellij-plugin/build/reports/pluginVerifier/

  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Regression check
        run: make regression

  external-rule-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-cleanup: on-success
          validate-wrappers: true
      # krit-types is the largest jar in the repo (shadow jar bundles
      # the Kotlin compiler + Analysis API). Cache the output so the
      # job doesn't pay the 2-3 minute build on every PR.
      # NOTE: cache-key glob must stay in sync with the `playground-rules`
      # job below — `hashFiles()` is only available in step contexts so a
      # workflow-level dedup is not possible.
      - name: Cache krit-types shadow jar
        id: cache-krit-types
        uses: actions/cache@v6
        with:
          path: tools/krit-types/build/libs
          key: krit-types-jar-${{ hashFiles('tools/krit-types/**/*.kt', 'tools/krit-types/**/*.kts', 'tools/krit-rule-api/**/*.kt', 'tools/krit-rule-api/**/*.kts') }}
      # examples/external-rule/ resolves dev.jasonpearson.krit:krit-rule-api
      # from mavenLocal, so stage a known-version snapshot first.
      - name: Stage krit-rule-api to mavenLocal
        working-directory: tools/krit-rule-api
        run: ./gradlew --no-daemon publishToMavenLocal -PkritVersion=0.0.0-ci
      - name: Build krit-types shadow jar
        if: steps.cache-krit-types.outputs.cache-hit != 'true'
        working-directory: tools/krit-types
        run: ./gradlew --no-daemon shadowJar
      - name: Run external-rule example integration test
        env:
          KRIT_TYPES_JAR: ${{ github.workspace }}/tools/krit-types/build/libs/krit-types.jar
        run: go test ./tests/externalrule/ -count=1 -timeout 600s -v

  playground-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-cleanup: on-success
          validate-wrappers: true
      # Cache-key glob must stay in sync with the `external-rule-example`
      # job above — see the note there for why a workflow-level dedup is
      # not possible.
      - name: Cache krit-types shadow jar
        id: cache-krit-types
        uses: actions/cache@v6
        with:
          path: tools/krit-types/build/libs
          key: krit-types-jar-${{ hashFiles('tools/krit-types/**/*.kt', 'tools/krit-types/**/*.kts', 'tools/krit-rule-api/**/*.kt', 'tools/krit-rule-api/**/*.kts') }}
      - name: Build krit-types shadow jar
        if: steps.cache-krit-types.outputs.cache-hit != 'true'
        working-directory: tools/krit-types
        run: ./gradlew --no-daemon shadowJar
      # The playground composite-builds krit-gradle-plugin,
      # krit-custom-rule-plugin, krit-rule-api, and krit-settings-plugin
      # from the local source tree, so no mavenLocal staging needed.
      - name: Run playground custom-rule integration test
        env:
          KRIT_TYPES_JAR: ${{ github.workspace }}/tools/krit-types/build/libs/krit-types.jar
        run: go test ./tests/playgroundrules/ -count=1 -timeout 600s -v

  krit-custom-rule-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-cleanup: on-success
          validate-wrappers: true
      # Publish krit-rule-api to mavenLocal so the functional test in the
      # custom-rule-plugin can resolve the SPI jar with a known version.
      - name: Stage krit-rule-api to mavenLocal
        working-directory: tools/krit-rule-api
        run: ./gradlew --no-daemon publishToMavenLocal -PkritVersion=0.0.0-ci
      - name: Validate krit-custom-rule-plugin
        working-directory: krit-custom-rule-plugin
        run: ./gradlew --no-daemon test --stacktrace
      - name: Upload custom-rule-plugin test reports
        if: failure()
        uses: actions/upload-artifact@de65e23aa2b7e23d713bb51fbfcb6d502f8667d8 # v4.6.2
        with:
          name: krit-custom-rule-plugin-test-reports
          path: krit-custom-rule-plugin/build/reports/tests/test/

  krit-settings-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-cleanup: on-success
          validate-wrappers: true
      # The settings plugin's functional test spins up a multi-project Gradle
      # build that auto-applies `dev.jasonpearson.krit` (the host plugin).
      # `settings.gradle.kts` composite-builds `../krit-gradle-plugin`, so a
      # local checkout is sufficient — no mavenLocal staging needed.
      - name: Validate krit-settings-plugin
        working-directory: krit-settings-plugin
        run: ./gradlew --no-daemon test --stacktrace
      - name: Upload settings-plugin test reports
        if: failure()
        uses: actions/upload-artifact@de65e23aa2b7e23d713bb51fbfcb6d502f8667d8 # v4.6.2
        with:
          name: krit-settings-plugin-test-reports
          path: krit-settings-plugin/build/reports/tests/test/

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install golangci-lint v2
        # GOTOOLCHAIN=auto lets `go install` fetch the Go toolchain the linter
        # requires when it is newer than the pinned go.mod version (setup-go
        # sets GOTOOLCHAIN=local, which otherwise fails the build of the tool).
        run: GOTOOLCHAIN=auto go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - name: Install gosec
        run: GOTOOLCHAIN=auto go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Run golangci-lint
        run: golangci-lint run ./...
      - name: Run gosec
        # Excluded rules:
        #   G103 — unsafe.Pointer is used intentionally (audited) for intern-table perf
        #   G104 — best-effort cleanup (os.Remove etc.) is documented and intentional
        #   G115 — integer-overflow conversions are bounded by upstream invariants
        #   G122 — filepath.Walk callbacks scan trusted local project trees
        #   G204 — Krit shells out to git/gradle/javac/etc. by design
        #   G301/G302/G306 — caches, scratch dirs, and reports are user-readable by design
        #   G304 — vfs/fsutil/cacheutil take filesystem paths as input by design
        #   G404 — non-cryptographic randomness is used for sampling/jitter only
        #   G602 — false positive on byte conversion of UintN(256)
        #   G703 — same path-as-input rationale as G304
        #   G704 — HTTP clients accept caller-supplied URLs by design
        #
        # internal/rules is excluded (the `$` keeps internal/rules/base in
        # scope; -exclude-dir is an unanchored regexp). gosec hands every file
        # of a package to go/packages as one argument each, and go/packages
        # splits the list into separate `go list` calls once the arguments
        # pass ~16 KB. Past that point each chunk type-checks as its own
        # package, so gosec reports bogus "undefined: ...Rule" errors and exits
        # 1. internal/rules crossed that line at ~397 files. The golangci-lint
        # step above still runs gosec over internal/rules, loading the package
        # whole.
        run: gosec -exclude=G103,G104,G115,G122,G204,G301,G302,G304,G306,G404,G602,G703,G704 -exclude-dir='internal/rules$' -fmt=junit-xml -out=gosec-report.xml -stdout ./...
      - name: Check gosec report exists
        id: gosec-exists
        if: always()
        uses: andstor/file-existence-action@v3
        with:
          files: gosec-report.xml
      - name: Publish security report
        if: always() && steps.gosec-exists.outputs.files_exists == 'true'
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: gosec-report.xml

  krit-fir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-cleanup: on-success
          validate-wrappers: true
      # `test` runs every project's tests, including :compiler-tests (golden
      # diagnostics, stub guards, and FixtureParityTest against the Go
      # fixtures in tests/fixtures).
      - name: Validate krit-fir
        working-directory: tools/krit-fir
        run: ./gradlew --no-daemon test --stacktrace
      # The split differential (FirIncrementalSplitDifferentialTest) compiles
      # every compiler-test scenario in pieces against a binary snapshot and
      # asserts that only whole-compilation-tiered rules differ from a full
      # compile. It takes about 5 minutes, so `test` excludes it and it runs
      # as its own step.
      - name: Split differential (incremental FIR tiering)
        working-directory: tools/krit-fir
        run: ./gradlew --no-daemon incrementalDifferentialTest --stacktrace
      # The planner differential (IncrementalPlannerDifferentialTest) runs about
      # 600 synthetic files through 40 mixed edits and asserts that every
      # planned check equals a fresh full check, with the planner engaged.
      # It takes about 2 minutes, so `test` excludes it and it runs as its
      # own step.
      - name: Planner differential (incremental FIR checks)
        working-directory: tools/krit-fir
        run: ./gradlew --no-daemon incrementalPlannerTest --stacktrace
      - name: Upload krit-fir test reports
        if: failure()
        uses: actions/upload-artifact@de65e23aa2b7e23d713bb51fbfcb6d502f8667d8 # v4.6.2
        with:
          name: krit-fir-test-reports
          path: |
            tools/krit-fir/build/reports/tests/test/
            tools/krit-fir/build/reports/tests/incrementalDifferentialTest/
            tools/krit-fir/build/reports/tests/incrementalPlannerTest/
            tools/krit-fir/compiler-tests/build/reports/tests/test/

  # oracle-backend-parity drives both JVM oracles (krit-types and
  # krit-fir) through their one-shot `--sources --output` CLIs and
  # asserts the analyze JSON is structurally equivalent. The gate
  # protects against silent divergence on the shared wire surface so
  # that `--oracle-backend=fir` stays a real drop-in for the default
  # KAA backend across every Kotlin construct exercised by the
  # fixture.
  oracle-backend-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-cleanup: on-success
          validate-wrappers: true
      - name: Cache krit-types shadow jar
        id: cache-krit-types
        uses: actions/cache@v6
        with:
          path: tools/krit-types/build/libs
          key: krit-types-jar-${{ hashFiles('tools/krit-types/**/*.kt', 'tools/krit-types/**/*.kts', 'tools/krit-rule-api/**/*.kt', 'tools/krit-rule-api/**/*.kts') }}
      - name: Build krit-types shadow jar
        if: steps.cache-krit-types.outputs.cache-hit != 'true'
        working-directory: tools/krit-types
        run: ./gradlew --no-daemon shadowJar
      # krit-types' own unit tests (call-resolution and dependency-edge
      # characterization against a real Analysis API session). No other job
      # runs them. `test` builds the thin jar under a different file name,
      # so it leaves the shadow jar above untouched.
      - name: Run krit-types unit tests
        working-directory: tools/krit-types
        run: ./gradlew --no-daemon test
      # TestFirCheckerExceptionIsIsolatedToRuleAndFileEndToEnd adds a
      # test-only throwing probe rule from krit-fir's compiled test classes to
      # a copy of the shadow jar. Build them on every run (the jar cache below
      # can skip the Gradle build), and BEFORE the shadow jar is restored or
      # built: testClasses also builds the thin `jar`, which has the same
      # build/libs/krit-fir.jar name and would overwrite the shadow jar.
      - name: Build krit-fir test classes
        working-directory: tools/krit-fir
        run: ./gradlew --no-daemon testClasses
      - name: Cache krit-fir shadow jar
        id: cache-krit-fir
        uses: actions/cache@v6
        with:
          path: tools/krit-fir/build/libs
          key: krit-fir-jar-${{ hashFiles('tools/krit-fir/**/*.kt', 'tools/krit-fir/**/*.kts', 'tools/krit-rule-api/**/*.kt', 'tools/krit-rule-api/**/*.kts') }}
      - name: Build krit-fir shadow jar
        if: steps.cache-krit-fir.outputs.cache-hit != 'true'
        working-directory: tools/krit-fir
        run: ./gradlew --no-daemon shadowJar
      - name: CLI default FIR scan
        run: |
          go build -o krit ./cmd/krit/
          project="$(mktemp -d)"
          printf 'fun answer() = 42\n' > "$project/Answer.kt"
          printf 'oracle:\n  classpath: []\n' > "$project/krit.yml"
          set +e
          KRIT_FIR_JAR="$PWD/tools/krit-fir/build/libs/krit-fir.jar" ./krit --no-type-oracle "$project"
          result=$?
          set -e
          test "$result" -le 1
      # TestFirPilotParity compiles the FIR pilot fixtures through krit-fir,
      # so it needs a standalone kotlin-stdlib on the classpath. The jar is
      # normally in the Gradle module cache after the shadowJar build above,
      # but a krit-fir jar cache hit can skip that build and leave the cache
      # cold, which would make the test skip silently. Resolve the jar
      # explicitly (falling back to a dependency resolution when the cache is
      # cold) and fail loudly if it is still missing, so the test runs rather
      # than skips.
      - name: Locate kotlin-stdlib jar
        run: |
          glob() {
            local base="$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-stdlib"
            local candidates=() f
            for f in "$base"/*/*/kotlin-stdlib-*.jar; do
              [ -f "$f" ] || continue
              case "$f" in *sources*|*javadoc*) continue;; esac
              candidates+=("$f")
            done
            [ ${#candidates[@]} -eq 0 ] && return 0
            printf '%s\n' "${candidates[@]}" | sort | tail -1
          }
          jar="$(glob)"
          if [ -z "$jar" ]; then
            echo "kotlin-stdlib not in Gradle cache; resolving krit-fir dependencies"
            (cd tools/krit-fir && ./gradlew --no-daemon --quiet :dependencies --configuration runtimeClasspath >/dev/null 2>&1 || true)
            jar="$(glob)"
          fi
          if [ -z "$jar" ]; then
            echo "::error::kotlin-stdlib jar not found; TestFirPilotParity would skip"
            exit 1
          fi
          echo "KOTLIN_STDLIB_JAR=$jar" >> "$GITHUB_ENV"
          echo "kotlin-stdlib: $jar"
      # TestOracleBackendParity guards the declaration surface across
      # both backends; TestFirOracleFactContract guards the FIR
      # expression surface (types, nullability, call targets, suspend
      # markers, diagnostics) the type-aware rules read — the facts the
      # cross-backend gate deliberately doesn't compare. TestFirFixtureParity
      # compiles every FIR rule's Go fixtures through krit-fir against the
      # compiler-tests stub library (the Java stubs are compiled with javac
      # from setup-java) and requires per-line agreement with the Go rule;
      # TestOracleKotlin24* and TestFirKotlin24Parity (#785) run the Kotlin 2.4
      # fixtures (named context parameters, explicit backing fields, `@all:`)
      # through both backends under explicit language modes;
      # the per-checker correctness tests pin known edge shapes; the rule
      # isolation test proves a throwing checker costs only its own rule and
      # file. The daemon relative-path tests prove `krit .` scans of different
      # projects never share a daemon and that each backend's daemon facts
      # come back (and are cached) under the caller's relative spelling.
      # All must pass before the FIR backend can be made the default.
      - name: Run oracle backend parity
        env:
          KRIT_TYPES_JAR: ${{ github.workspace }}/tools/krit-types/build/libs/krit-types.jar
        run: |
          set -o pipefail
          go test ./tests/parity/ -count=1 -timeout 30m -run 'TestOracleBackendParity|TestOracleKotlin24|TestFirKotlin24Parity|TestFirOracleFactContract|TestFirFixtureParity|TestFirProperty|FuzzFirCheckers|TestComposeRememberWithoutKey_|TestCollectInOnCreateWithoutLifecycle_|TestInjectDispatcher_|TestUnsafeCastWhenNullable_|TestFirCheckerExceptionIsIsolatedToRuleAndFileEndToEnd|TestFirCheckDaemonRelativeScansOfTwoProjectsStaySeparate|TestOracleDaemonRelative|TestKAAOracleCacheRefreshes|TestKAADaemonResolvesLibraryCallsLikeOneShot' -v | tee parity.log
          # Top-level tests only: an exempt rule's subtest may skip. The
          # daemon relative-path tests' per-backend subtests must all run.
          if grep -qE -- '--- SKIP: (TestOracleKotlin24[A-Za-z]+|TestFirKotlin24Parity|TestFirFixtureParity|TestFirProperty_[A-Za-z]+|FuzzFirCheckers|Test(ComposeRememberWithoutKey|CollectInOnCreateWithoutLifecycle|InjectDispatcher|UnsafeCastWhenNullable)_[A-Za-z]+|TestFirCheckerExceptionIsIsolatedToRuleAndFileEndToEnd|TestFirCheckDaemonRelativeScansOfTwoProjectsStaySeparate|TestOracleDaemonRelative[A-Za-z]+(/(fir|kaa)(-symlink)?)?|TestKAAOracleCacheRefreshes[A-Za-z]+|TestKAADaemonResolvesLibraryCallsLikeOneShot) \(' parity.log; then
            echo "::error::a FIR parity/property/fuzz test skipped; the CI parity job must execute them"
            exit 1
          fi

  # warm-clean-matrix (#786) seeds a warm cache or daemon for the structural
  # pipeline and for both JVM oracles (krit-types and krit-fir), mutates the
  # project (return type, nullability, signature, annotations, file add /
  # delete / rename, imports, overloads, classpath, helper jar), and requires
  # the warm result to equal a fresh process's over the same tree. It is a
  # sibling of oracle-backend-parity so its ~10 minutes run in parallel; it
  # needs the same helper jars. KRIT_WARM_CLEAN_MATRIX=1 opts the tests in (a
  # plain `make test` skips them), and a top-level skip fails the job, so a
  # missing jar cannot silently pass.
  warm-clean-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-cleanup: on-success
          validate-wrappers: true
      - name: Cache krit-types shadow jar
        id: cache-krit-types
        uses: actions/cache@v6
        with:
          path: tools/krit-types/build/libs
          key: krit-types-jar-${{ hashFiles('tools/krit-types/**/*.kt', 'tools/krit-types/**/*.kts', 'tools/krit-rule-api/**/*.kt', 'tools/krit-rule-api/**/*.kts') }}
      - name: Build krit-types shadow jar
        if: steps.cache-krit-types.outputs.cache-hit != 'true'
        working-directory: tools/krit-types
        run: ./gradlew --no-daemon shadowJar
      - name: Cache krit-fir shadow jar
        id: cache-krit-fir
        uses: actions/cache@v6
        with:
          path: tools/krit-fir/build/libs
          key: krit-fir-jar-${{ hashFiles('tools/krit-fir/**/*.kt', 'tools/krit-fir/**/*.kts', 'tools/krit-rule-api/**/*.kt', 'tools/krit-rule-api/**/*.kts') }}
      - name: Build krit-fir shadow jar
        if: steps.cache-krit-fir.outputs.cache-hit != 'true'
        working-directory: tools/krit-fir
        run: ./gradlew --no-daemon shadowJar
      - name: Locate kotlin-stdlib jar
        run: |
          glob() {
            local base="$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-stdlib"
            local candidates=() f
            for f in "$base"/*/*/kotlin-stdlib-*.jar; do
              [ -f "$f" ] || continue
              case "$f" in *sources*|*javadoc*) continue;; esac
              candidates+=("$f")
            done
            [ ${#candidates[@]} -eq 0 ] && return 0
            printf '%s\n' "${candidates[@]}" | sort | tail -1
          }
          jar="$(glob)"
          if [ -z "$jar" ]; then
            echo "kotlin-stdlib not in Gradle cache; resolving krit-fir dependencies"
            (cd tools/krit-fir && ./gradlew --no-daemon --quiet :dependencies --configuration runtimeClasspath >/dev/null 2>&1 || true)
            jar="$(glob)"
          fi
          if [ -z "$jar" ]; then
            echo "::error::kotlin-stdlib jar not found; the warm-versus-clean matrix needs it for krit-types"
            exit 1
          fi
          echo "KOTLIN_STDLIB_JAR=$jar" >> "$GITHUB_ENV"
          echo "kotlin-stdlib: $jar"
      - name: Run warm-versus-clean mutation matrix
        env:
          KRIT_TYPES_JAR: ${{ github.workspace }}/tools/krit-types/build/libs/krit-types.jar
          KRIT_FIR_JAR: ${{ github.workspace }}/tools/krit-fir/build/libs/krit-fir.jar
          KRIT_WARM_CLEAN_MATRIX: "1"
        run: |
          set -o pipefail
          go test ./tests/parity/ -count=1 -timeout 45m -run 'TestWarmCleanMutation' -v | tee matrix.log
          # Top-level tests only: a row may skip itself (a known stale-cache
          # bug listed in wcKnownStale, or the compiler-setting row waiting on
          # #784), but a whole matrix must not.
          if grep -qE -- '--- SKIP: TestWarmCleanMutation[A-Za-z]* \(' matrix.log; then
            echo "::error::a warm-versus-clean matrix test skipped as a whole; the CI job must execute it"
            exit 1
          fi
      - name: Upload matrix log
        if: failure()
        uses: actions/upload-artifact@de65e23aa2b7e23d713bb51fbfcb6d502f8667d8 # v4.6.2
        with:
          name: warm-clean-matrix-log
          path: matrix.log

  krit-lint-sarif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build and self-lint
        run: bash scripts/self-lint.sh
      - name: Upload SARIF
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: results.sarif
          category: krit-self-lint

  # actionlint validates the workflow files themselves — catches semantic
  # mistakes (e.g. `hashFiles()` at workflow-`env` scope) that plain YAML
  # parsers accept but GitHub Actions silently rejects, causing the
  # workflow to fail to load with zero checks scheduled.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@latest
      - name: Run actionlint
        run: bash scripts/lint-actions.sh
